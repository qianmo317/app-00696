<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>极简・数独</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="bg-overlay"></div>

    <header>
      <h1>极简数独</h1>
      <div class="header-controls">
        <select id="difficulty-select" class="difficulty-select">
          <option value="easy">初级</option>
          <option value="medium">中级</option>
          <option value="hard">高级</option>
        </select>
        <div id="theme-toggle" style="cursor: pointer; display: none">
          Scheme
        </div>
        <!-- Placeholder for potential light/dark toggle -->
      </div>
    </header>

    <main>
      <div class="game-info">
        <div class="info-item">错误: <span id="mistakes">0</span>/3</div>
        <div class="timer" id="timer">00:00</div>
        <div class="info-item">
          难度: <span id="difficulty-display">初级</span>
        </div>
      </div>

      <div class="board-wrapper">
        <div id="board" class="sudoku-board">
          <!-- Cells generated by JS -->
        </div>
        <div id="pause-overlay" class="pause-overlay">
          <div class="pause-content">
            <svg viewBox="0 0 24 24" class="pause-icon">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
            </svg>
            <span>暂停中</span>
          </div>
        </div>
      </div>

      <div class="game-controls">
        <button class="control-btn" id="btn-undo">
          <svg viewBox="0 0 24 24">
            <path
              d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"
            />
          </svg>
          <span>撤销</span>
        </button>
        <button class="control-btn" id="btn-erase">
          <svg viewBox="0 0 24 24">
            <path
              d="M16.24 3.56l4.95 4.94c.78.79.78 2.05 0 2.84L12 20.53a4.008 4.008 0 0 1-5.66 0L2.81 17c-.78-.79-.78-2.05 0-2.84l10.6-10.6c.79-.78 2.05-.78 2.83 0zM4.22 15.58l3.54 3.53c.78.79 2.04.79 2.83 0l8.48-8.48-4.95-4.95L4.22 15.58z"
            />
          </svg>
          <span>擦除</span>
        </button>
        <button class="control-btn" id="btn-note">
          <svg viewBox="0 0 24 24">
            <path
              d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
            />
          </svg>
          <span>笔记</span>
          <span class="indicator" id="note-indicator">OFF</span>
        </button>
        <button class="control-btn" id="btn-hint">
          <svg viewBox="0 0 24 24">
            <path
              d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6C7.8 12.16 7 10.63 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"
            />
          </svg>
          <span>提示</span>
          <span class="indicator" id="hint-count">3</span>
        </button>
        <button class="control-btn" id="btn-pause">
          <svg viewBox="0 0 24 24" id="btn-pause-icon">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
          <span id="btn-pause-text">暂停</span>
        </button>
      </div>

      <div class="numpad">
        <button class="num-btn" data-num="1">1</button>
        <button class="num-btn" data-num="2">2</button>
        <button class="num-btn" data-num="3">3</button>
        <button class="num-btn" data-num="4">4</button>
        <button class="num-btn" data-num="5">5</button>
        <button class="num-btn" data-num="6">6</button>
        <button class="num-btn" data-num="7">7</button>
        <button class="num-btn" data-num="8">8</button>
        <button class="num-btn" data-num="9">9</button>
      </div>
    </main>

    <!-- Win Modal -->
    <div id="win-modal" class="modal-overlay">
      <div class="modal-content">
        <h2 class="modal-title">恭喜胜利!</h2>
        <p>难度: <span id="win-difficulty"></span></p>
        <p>用时: <span id="win-time"></span></p>
        <button class="btn-primary" id="btn-new-game">新游戏</button>
      </div>
    </div>

    <!-- Game Over Modal -->
    <div id="lose-modal" class="modal-overlay">
      <div class="modal-content">
        <h2 class="modal-title" style="color: var(--error)">游戏结束</h2>
        <p>错误次数已达上限。</p>
        <button class="btn-primary" id="btn-retry">重试</button>
      </div>
    </div>

    <!-- Confetti Script (Inline for simplicity or separate file) -->
    <!-- We will use a separate confetti.js or a simple implementation in app.js. 
         For high end feel, let's use a popular library or a custom one. 
         I will write a custom lightweight one in confetti.js -->
    <script src="js/sudoku_core.js"></script>
    <script src="js/confetti.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
